<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>aly.bar</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;

            background:
                radial-gradient(circle at 50% -20%, #252525 0%, transparent 45%),
                #0b0b0d;

            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif;
        }

        .card {
            width: 100%;
            max-width: 620px;

            padding: 42px;

            background: rgba(18, 18, 21, 0.88);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;

            box-shadow:
                0 25px 70px rgba(0, 0, 0, 0.55),
                inset 0 1px 0 rgba(255, 255, 255, 0.03);

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
        }

        .top {
            display: flex;
            align-items: center;
            gap: 18px;
            margin-bottom: 28px;
        }

        .avatar {
            width: 64px;
            height: 64px;

            border-radius: 16px;

            background: linear-gradient(135deg, #25252a, #151519);
            border: 1px solid rgba(255, 255, 255, 0.08);

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 25px;
            font-weight: 700;
            color: #fff;

            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.35);
        }

        h1 {
            margin: 0;
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.04em;
        }

        .meta {
            margin-top: 4px;
            color: #77777f;
            font-size: 0.9rem;
        }

        .bio {
            margin: 0 0 30px;

            color: #a5a5ad;
            font-size: 0.98rem;
            line-height: 1.7;
        }

        .links {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 34px;
        }

        .links a {
            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 13px 15px;

            color: #e9e9ec;
            text-decoration: none;

            background: #151519;
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 11px;

            font-size: 0.9rem;
            transition:
                transform 0.18s ease,
                background 0.18s ease,
                border-color 0.18s ease;
        }

        .links a::after {
            content: "↗";
            color: #66666e;
            transition: transform 0.18s ease;
        }

        .links a:hover {
            background: #1c1c21;
            border-color: rgba(255, 255, 255, 0.14);
            transform: translateY(-2px);
        }

        .links a:hover::after {
            transform: translate(2px, -2px);
        }

        .badges-title {
            color: #66666e;
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            margin-bottom: 12px;
        }

        .badge-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;

            padding-top: 18px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
        }

        .badge-container a {
            display: block;
            border-radius: 5px;
            overflow: hidden;
            opacity: 0.7;

            transition:
                opacity 0.18s ease,
                transform 0.18s ease;
        }

        .badge-container a:hover {
            opacity: 1;
            transform: translateY(-2px);
        }

        .badge-container img {
            display: block;
            width: 88px;
            height: 31px;

            image-rendering: pixelated;
        }

        @media (max-width: 520px) {
            .card {
                padding: 28px 22px;
                border-radius: 16px;
            }

            .links {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>

<body>

</body>
</html>
