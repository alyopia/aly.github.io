    <script>
        (function () {
            const cat = document.createElement("div");

            let catX = 32;
            let catY = 32;
            let mouseX = 32;
            let mouseY = 32;
            let frame = 0;

            const speed = 10;

            const sprites = {
                idle: [[-3, -3]],
                alert: [[-7, -3]],
                scratchSelf: [[-5, 0], [-6, 0], [-7, 0]],
                N: [[-1, -2], [-1, -3]],
                NE: [[0, -2], [0, -3]],
                E: [[-3, 0], [-3, -1]],
                SE: [[-5, -1], [-5, -2]],
                S: [[-6, -3], [-7, -2]],
                SW: [[-5, -3], [-6, -1]],
                W: [[-4, -2], [-4, -3]],
                NW: [[-1, 0], [-1, -1]]
            };

            cat.id = "oneko";
            cat.setAttribute("aria-hidden", "true");

            cat.style.position = "fixed";
            cat.style.width = "32px";
            cat.style.height = "32px";
            cat.style.pointerEvents = "none";
            cat.style.zIndex = "2147483647";
            cat.style.imageRendering = "pixelated";
            cat.style.backgroundImage =
                "url('https://raw.githubusercontent.com/adryd325/oneko.js/14bab15a755d0e35cd4ae19c931d96d306f99f42/oneko.gif')";
            cat.style.backgroundRepeat = "no-repeat";

            cat.style.left = "16px";
            cat.style.top = "16px";

            document.body.appendChild(cat);

            document.addEventListener("mousemove", function (event) {
                mouseX = event.clientX;
                mouseY = event.clientY;
            });

            function setSprite(name) {
                const set = sprites[name] || sprites.idle;
                const sprite = set[frame % set.length];

                cat.style.backgroundPosition =
                    (sprite[0] * 32) + "px " +
                    (sprite[1] * 32) + "px";
            }

            function moveCat() {
                const dx = catX - mouseX;
                const dy = catY - mouseY;

                const distance = Math.sqrt(
                    dx * dx + dy * dy
                );

                if (distance > 48) {
                    let direction = "";

                    if (dy / distance > 0.5) {
                        direction = "N";
                    } else if (dy / distance < -0.5) {
                        direction = "S";
                    }

                    if (dx / distance > 0.5) {
                        direction += "W";
                    } else if (dx / distance < -0.5) {
                        direction += "E";
                    }

                    setSprite(direction);

                    catX -= (dx / distance) * speed;
                    catY -= (dy / distance) * speed;
                } else {
                    setSprite("idle");
                }

                catX = Math.max(
                    16,
                    Math.min(window.innerWidth - 16, catX)
                );

                catY = Math.max(
                    16,
                    Math.min(window.innerHeight - 16, catY)
                );

                cat.style.left = (catX - 16) + "px";
                cat.style.top = (catY - 16) + "px";

                frame++;
            }

            setSprite("idle");
            setInterval(moveCat, 100);
        })();
    </script>
